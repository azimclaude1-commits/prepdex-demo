benar. Ia membungkus akaun belum terima PKS, pembiayaan perdagangan dan nota rantaian bekalan ke dalam kolam kredit on-chain yang standard. Pengurus aset berlesen menjalankan usaha wajar dan servis, dan pelabur boleh melanggan setiap kolam serta menjejaki pinjaman asas secara masa nyata.","Vela Finance es un protocolo de crédito privado para activos del mundo real. Agrupa cuentas por cobrar de pymes, financiación comercial y pagarés de cadena de suministro en pools de crédito on-chain estandarizados. Gestoras con licencia hacen la diligencia y el seguimiento, y los inversores pueden suscribirse por pool y seguir los préstamos subyacentes en tiempo real.","Ang Vela Finance ay private-credit protocol para sa real-world asset. Pinagsasama nito ang receivables ng SME, trade finance at supply-chain note sa mga standardized na on-chain credit pool. Mga lisensyadong asset manager ang humahawak ng diligence at servicing, at puwedeng mag-subscribe ang investor kada pool at subaybayan ang mga loan nang real time."],Verify:["검증","検証","Sahkan","Verificar","I-verify"],Verifying:["확인 중","確認中","Mengesahkan","Verificando","Bine-verify"],Vesting:["베스팅","ベスティング","Peletakhakan","Vesting","Vesting"],"Vesting curve":["베스팅 곡선","ベスティング曲線","Lengkung peletakhakan","Curva de vesting","Vesting curve"],"Vetted early projects in USDC, with automatic refunds when oversubscribed.":["검증된 초기 프로젝트를 USDC로 청약, 초과 청약 시 자동 환불.","審査済みの初期プロジェクトをUSDCで申込。超過分は自動返金。","Projek awal yang disaring dalam USDC, dengan bayaran balik automatik apabila terlebih langganan.","Proyectos tempranos verificados en USDC, con reembolso automático si hay sobresuscripción.","Mga na-vet na early project sa USDC, may awtomatikong refund kapag oversubscribed."],"Vetted early-stage projects, subscribed in USDC. Oversubscribed sales allocate pro rata with automatic refunds, and tokens trade on spot right after TGE.":["검증된 초기 프로젝트를 USDC로 청약하세요. 초과 청약 시 비례 배분과 자동 환불이 이뤄지며, TGE 직후 현물에서 바로 거래됩니다.","審査済みの初期プロジェクトに USDC で申し込めます。超過申込は按分割当と
