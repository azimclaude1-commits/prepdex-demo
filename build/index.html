"Mga trade"],"Traditional private credit is a $1.7T market that is hard to access, opaque and illiquid. Vela records every disbursement, repayment and delinquency in smart contracts, turning monthly reports into verifiable on-chain state, and lets LP shares trade on a secondary market.":["전통적인 사모 대출은 1.7조 달러 규모지만 접근이 어렵고 불투명하며 유동성이 낮습니다. Vela는 모든 대출 실행·상환·연체를 스마트 컨트랙트에 기록해 월간 보고서를 검증 가능한 온체인 상태로 바꾸고, LP 지분을 2차 시장에서 거래할 수 있게 합니다.","従来のプライベートクレジットは 1.7 兆ドル規模ですが、参入が難しく不透明で流動性に乏しい市場です。Vela はすべての貸付・返済・延滞をスマートコントラクトに記録し、月次報告を検証可能なオンチェーン状態に変え、LP 持分をセカンダリー市場で取引可能にします。","Kredit persendirian tradisional ialah pasaran $1.7T yang sukar diakses, legap dan tidak cair. Vela merekod setiap pengeluaran, pembayaran balik dan tunggakan dalam kontrak pintar, menukar laporan bulanan kepada keadaan on-chain yang boleh disahkan, dan membolehkan saham LP diniagakan di pasaran sekunder.","El crédito privado tradicional es un mercado de 1,7 billones de dólares difícil de acceder, opaco e ilíquido. Vela registra cada desembolso, pago y mora en contratos inteligentes, convierte los informes mensuales en un estado on-chain verificable y permite negociar participaciones LP en un mercado secundario.","Ang tradisyonal na private credit ay $1.7T na market na mahirap pasukin, malabo at hindi likido. Itinatala ng Vela ang bawat disbursement, bayad at delinquency sa smart contract, ginagawang verifiable na on-chain state ang buwanang report, at pinapayagang i-trade ang LP share sa secondary market."],Transfer:["이체","振替","Pindah","Transferir","Ilipat"],"Transfer from spot":["현물에서 이체","現物から振替","Pindah dari spot","Transferir desde spot","Ilipat mula sa spot"],Transferred:["이체 완료","振替完了","Dipindahkan","Transferido","Nailipat"],Treasury:["트레저리","トレジャリー","Perbendaharaan","Tesorería","Treasury"],Trend:["추세","推移","Trend","Tendencia","Trend"],Type:["유형","種類","Jenis","Tipo","Uri"],"USDC from your spot account only. Convert USDT to USDC with Convert.":["현물 계정의 USDC만 사용할 수 있습니다. 간편 환전으로 USDT를 USDC로 바꾸세요.","現物口座の adbir urus, staking rizab kerugian pertama dan diskaun yuran. Pen-stake menanggung risiko kerugian pertama dan memperoleh bahagian hasil protokol.","VELA se usa para gobernanza, staking en la reserva de primera pérdida y descuentos en comisiones. Quienes hacen staking asumen el riesgo de primera pérdida y reciben parte de los ingresos del protocolo.","Ginagamit ang VELA sa governance, first-loss reserve staking at fee discount. Sinasalo ng mga staker ang first-loss risk at may bahagi sila sa kita ng protocol."],Value:["평가액","評価額","Nilai","Valor","Halaga"],"Vela Finance is a private-credit protocol for real-world assets. It packages SME receivables, trade finance and supply-chain notes into standardised on-chain credit pools. Licensed asset managers run diligence and servicing, and investors can subscribe per pool and track the underlying loans in real time.":["Vela Finance는 실물자산(RWA)을 위한 사모 대출 프로토콜입니다. 중소기업 매출채권, 무역금융, 공급망 어음을 표준화된 온체인 대출 풀로 묶고, 라이선스 자산운용사가 실사와 사후 관리를 맡습니다. 투자자는 풀별로 청약하고 기초 대출을 실시간으로 추적할 수 있습니다.","Vela Finance は現実資産（RWA）向けのプライベートクレジットプロトコルです。中小企業の売掛債権、貿易金融、サプライチェーン手形を標準化されたオンチェーン融資プールにまとめ、認可資産運用会社が審査と管理を担います。投資家はプールごとに申し込み、裏付けとなる貸付をリアルタイムで追跡できます。","Vela Finance ialah protokol kredit persendirian untuk aset dunia sebenar. Ia membungkus akaun belum terima PKS, pembiayaan perdagangan dan nota rantaian bekalan ke dalam kolam kredit on-chain yang standard. Pengurus aset berlesen menjalankan usaha wajar dan servis, dan pelabur boleh melanggan setiap kolam serta menjejaki pinjaman asas secara masa nyata.","Vela Finance es un protocolo de crédito privado para activos del mundo real. Agrupa cuentas por cobrar de pymes, financiación comercial y pagarés de cadena de suministro en pools de crédito on-chain estandarizados. Gestoras con licencia hacen la diligencia y el seguimiento, y los inversores pueden suscribirse por pool y seguir los préstamos subyacentes en tiempo real.","Ang Vela Finance ay private-credit protocol para sa real-world asset. Pinagsasama nito ang receivables ng SME, trade finance at supply-chain note sa mga standardized na on-chain credit pool. Mga lisensyadong asset manager ang humahawak ng diligence at servicing, at puwedeng mag-subscribe ang investor kada pool at subaybayan ang mga loan nang real time."],Verifying:["확인 중","確認中","Mengesahkan","Verificando","Bine-verify"],Vesting:["베스팅","ベスティング","Peletakhakan","Vesting","Vesting"],"Vesting curve":["베스팅 곡선","ベスティング曲線","Lengkung peletakhakan","Curva de vesting","Vesting curve"],"Vetted early projects in USDC, with automatic refunds when oversubscribed.":["검증된 초기 프로젝트를 USDC로 청약, 초과 청약 시 자동 환불.","審査済みの初期プロジェクトをUSDCで申込。超過分は自動返金。","Projek awal yang disaring dalam USDC, dengan bayaran balik automatik apabila terlebih langganan.","Proyectos tempranos verificados en USDC, con reembolso automático si hay sobresuscripción.","Mga na-vet na early project sa USDC, may awtomatikong refund kapag oversubscribed."],"Vetted early-stage projects, subscribed in USDC. Oversubscribed sales allocate pro rata with automatic refunds, and tokens trade on spot right after TGE.":["검증된 초기 프로젝트를 USDC로 청약하세요. 초과 청약 시 비례 배분과 자동 환불이 이뤄지며, TGE 직후 현물에서 바로 거래됩니다.","審査済みの初期プロジェクトに USDC で申し込めます。超過申込は按分割当と自動返金、トークンは TGE 直後から現物で取引できます。","Projek peringkat awal yang disaring, dilanggan dalam USDC. Jualan terlebih langgan diperuntukkan pro rata dengan bayaran balik automatik, dan token diniagakan di spot sejurus selepas TGE.","Proyectos en fase temprana verificados, suscritos en USDC. Las ventas sobresuscritas se asignan a prorrata con reembolso automático y los tokens cotizan en spot justo después del TGE.","Mga na-vet na early-stage project, sina-subscribe gamit ang USDC. Pro rata ang allocation kapag oversubscribed na may awtomatikong refund, at agad na nate-trade sa spot ang token pagkatapos ng TGE."],View:["보기","見る","Lihat","Ver","Tingnan"],"View activity":["활동 보기","履歴を見る","Lihat aktiviti","Ver actividad","Tingnan ang aktibidad"],"View assets":["자산 보기","資産を見る","Lihat aset","Ver activos","T
